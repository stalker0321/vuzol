name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vuzol
          POSTGRES_PASSWORD: vuzol-ci-only # pragma: allowlist secret
          POSTGRES_DB: vuzol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vuzol -d vuzol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VUZOL_TEST_DATABASE_DSN: postgresql://vuzol:vuzol-ci-only@127.0.0.1:5432/vuzol_test # pragma: allowlist secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm /tmp/gitleaks.tar.gz

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          VUZOL_DATABASE_DSN_REFERENCE: env:VUZOL_DATABASE_DSN
          VUZOL_DATABASE_DSN: postgresql+psycopg://vuzol:vuzol-ci-only@127.0.0.1:5432/vuzol_test # pragma: allowlist secret

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Type check
        run: make type-check

      - name: Run full test suite
        run: make test

      - name: Run security checks
        run: |
          uv run python -m pip install --quiet --upgrade pip
          make security

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run migrations and PostgreSQL tests
        run: make test-postgres

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build containers
        run: docker compose build

      - name: Build minimal provider sandbox
        run: docker build --file Dockerfile.sandbox --tag vuzol-sandbox:ci .

      - name: Verify provider sandbox tool and isolation contract
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --user 10001:10001 \
            --entrypoint /bin/sh \
            vuzol-sandbox:ci \
            -ec '
              test "$(id -u)" = 10001
              test "$(id -g)" = 10001
              command -v grok
              command -v git
              command -v make
              ! command -v python3
              ! test -e /var/run/docker.sock
              ! touch /workspace/image-must-remain-read-only
            '
