# Append after the normal runtime overrides at an owner-authorized rollout.
# Reuse the existing standalone memory-writer service (compose profile memory).
# Set VUZOL_CHAT_RELEASE_IMAGE to the SAME immutable image used by all consumers.
services:
  worker:
    image: ${VUZOL_CHAT_RELEASE_IMAGE:?immutable chat release image required}
    environment:
      VUZOL_CHAT__MEMORY_ENABLED: "true"
  interpreter:
    image: ${VUZOL_CHAT_RELEASE_IMAGE:?immutable chat release image required}
    environment:
      VUZOL_CHAT__MEMORY_ENABLED: "true"
  telegram-ingress:
    image: ${VUZOL_CHAT_RELEASE_IMAGE:?immutable chat release image required}
    environment:
      VUZOL_CHAT__MEMORY_ENABLED: "true"
  telegram-delivery:
    image: ${VUZOL_CHAT_RELEASE_IMAGE:?immutable chat release image required}
    environment:
      VUZOL_CHAT__MEMORY_ENABLED: "true"
  memory-writer:
    image: ${VUZOL_CHAT_RELEASE_IMAGE:?immutable chat release image required}
    environment:
      VUZOL_CHAT__MEMORY_ENABLED: "true"
