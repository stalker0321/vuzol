<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),ns='http://www.w3.org/2000/svg',world=document.getElementById('world'),canvas=document.getElementById('canvas'),detail=document.getElementById('detail');
let x=25,y=25,z=.75,drag=null;
const el=(name,text,parent=detail)=>{const e=document.createElement(name);if(text!==undefined)e.textContent=text;parent.append(e);return e};
const svg=(name,attrs,parent=world)=>{const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e};
function transform(){world.setAttribute('transform',`translate(${x} ${y}) scale(${z})`)}
function reset(){x=25;y=25;z=Math.min(1,(canvas.clientWidth-50)/1100);transform()}
function render(){world.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),r=document.getElementById('route').value,i=document.getElementById('implementation').value;const selected=data.scenarios.filter(s=>(!q||JSON.stringify(s).toLowerCase().includes(q))&&(!r||s.route===r)&&(!i||s.implementation===i));const positions=new Map(selected.map((s,n)=>[s.id,[(n%3)*370,Math.floor(n/3)*145]]));for(const [a,b] of data.edges){if(!positions.has(a)||!positions.has(b))continue;const [ax,ay]=positions.get(a),[bx,by]=positions.get(b);svg('path',{d:`M${ax+170},${ay+108} L${bx+170},${by}`})}for(const s of selected){const [px,py]=positions.get(s.id),g=svg('g',{class:'node',transform:`translate(${px},${py})`,tabindex:0,role:'button','aria-label':s.title});svg('rect',{width:345,height:110,rx:9},g);const title=svg('text',{x:14,y:28},g);title.textContent=s.title;const status=svg('text',{x:14,y:57},g);status.textContent=`Код: ${s.implementation}`;const label=svg('text',{x:14,y:83},g);label.textContent=`${s.route} · live: ${s.live}`;g.addEventListener('click',()=>show(s));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(s)}})}transform()}
function show(s){detail.replaceChildren();el('h2',s.title);el('p',s.example);for(const k of ['implementation','live','route','evidence'])el('span',`${k}: ${s[k]}`).className='badge';const fields={principal:'Полномочия',guards:'Условия и flags',steps:'Шаги',state:'Сохранённое состояние',effects:'Эффекты и границы',handoff:'Очереди и корреляция',success:'Что считается успехом',exits:'Остановки и выходы',legacy:'Legacy / ограничения'};for(const [k,title] of Object.entries(fields)){el('h3',title);if(Array.isArray(s[k])){const list=el('ol');for(const step of s[k])el('li',step,list)}else el('p',s[k])}for(const k of ['sources','tests']){el('h3',k==='sources'?'Исходники':'Тестовые ссылки (не live evidence)');for(const ref of s[k]){const p=el('p'),path=ref.split('::')[0],a=el('a',ref,p);a.href='../../'+path}}}
document.getElementById('status').textContent=data.status;
const report=data.coverage_report;document.getElementById('notice').textContent=`Входов в статическом инвентаре: ${report.inventory.length}; непокрыто: ${report.uncovered.length}; без consumer: ${report.missing_consumers.length}. Runtime enablement проверяется отдельно.`;
document.getElementById('coverage').onclick=()=>{detail.replaceChildren();el('h2','Проверяемое покрытие');el('p',report.scope_limit);el('pre',JSON.stringify(report,null,2))};
const queues=el('button','Очереди',document.querySelector('.tools'));
queues.onclick=()=>{detail.replaceChildren();el('h2','Outbox: кто продолжает работу');for(const [name,contract] of Object.entries(data.outbox_contracts)){el('h3',name);for(const [k,v] of Object.entries(contract))el('p',`${k}: ${v}`);const entry=report.inventory.find(e=>e.id==='outbox:'+name);if(entry)el('pre',JSON.stringify({producers:entry.producers,consumers:entry.consumers},null,2))}};
const evidence=el('button','Live-сверка',document.querySelector('.tools'));
evidence.onclick=()=>{detail.replaceChildren();el('h2','Сверка, не приёмка всех сценариев');for(const item of data.runtime_evidence){el('h3',`${item.at} · ${item.kind}`);el('p',item.value)}};
document.getElementById('findings').onclick=()=>{detail.replaceChildren();el('h2','Небольшие изменения и риски');for(const f of data.findings){el('h3',f.id);for(const [k,v] of Object.entries(f))if(k!=='id')el('p',`${k}: ${v}`)}};
for(const id of ['search','route','implementation'])document.getElementById(id).addEventListener('input',render);
document.getElementById('overview').onclick=()=>{reset();render()};document.getElementById('plus').onclick=()=>{z=Math.min(2.5,z*1.2);transform()};document.getElementById('minus').onclick=()=>{z=Math.max(.2,z/1.2);transform()};
canvas.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(.2,Math.min(2.5,z*(e.deltaY>0?.9:1.1)));transform()},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag=[e.clientX-x,e.clientY-y];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;x=e.clientX-drag[0];y=e.clientY-drag[1];transform()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);reset();render();
</script></html>
